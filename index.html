<!DOCTYPE html>
<html>
<head>
<title>The Ghost of Denmark</title>

<style>

body {
    font-family: Georgia, serif;
    background:#111827;
    color:white;
    text-align:center;
}

h1 {
    color:#e8c97a;
}

#game {
    max-width:900px;
    margin:auto;
}

button {
    padding:12px 20px;
    margin:8px;
    background:#b8860b;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover {
    background:#d4af37;
}


#board {
    display:grid;
    grid-template-columns:repeat(5,100px);
    gap:5px;
    justify-content:center;
    margin:20px;
}


.space {
    height:80px;
    width:100px;
    background:#374151;
    border:2px solid #d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}


.player {
    background:#8b0000;
}


.card {
    background:#1f2937;
    padding:20px;
    margin:20px;
    border-radius:10px;
}

</style>

</head>


<body>

<div id="game">

<h1>🎭 The Ghost of Denmark</h1>

<p>
Uncover the truth behind King Hamlet's murder before tragedy strikes.
</p>


<div id="character">

<h2>Choose Your Character</h2>

<button onclick="chooseCharacter('Hamlet')">
🖤 Hamlet
</button>

<button onclick="chooseCharacter('Horatio')">
📖 Horatio
</button>

<button onclick="chooseCharacter('Ophelia')">
🌹 Ophelia
</button>

<button onclick="chooseCharacter('Laertes')">
⚔️ Laertes
</button>

</div>


<h2 id="player"></h2>


<div id="board"></div>


<button onclick="rollDice()">
🎲 Roll Dice
</button>


<h2 id="status"></h2>


<div class="card">

<h2>Evidence Collected</h2>

<p id="clues">
0 / 5 clues
</p>

</div>


<div id="event"></div>


</div>



<script>


let character="";

let position=0;

let clues=0;



let spaces=[
"Gate",
"Courtyard",
"Library",
"Throne Room",
"Queen Room",
"Ghost Tower",
"Hamlet Room",
"Chapel",
"Dungeon",
"Graveyard",
"Final Trial",
"Castle Hall",
"Garden",
"Tower",
"Secret Room"
];



let evidence=[
"The Ghost reveals Claudius killed King Hamlet.",
"You discover the poison bottle.",
"You find proof Claudius wanted the crown.",
"You organize the play to test Claudius.",
"You discover the king's last message."
];


let decisions=[
"Do you trust the Ghost? Gain a clue.",
"You investigate Claudius secretly. Move forward.",
"You protect Ophelia. Gain trust.",
"You confront the king. Danger increases."
];


let consequences=[
"Claudius suspects you. Lose a turn.",
"Laertes challenges you. Move back.",
"Denmark falls into chaos. Lose a clue.",
"You are trapped in the castle."
];



// Create board

function createBoard(){

let board=document.getElementById("board");

spaces.forEach((space,index)=>{

let div=document.createElement("div");

div.className="space";

div.id="space"+index;

div.innerHTML=space;

board.appendChild(div);

});

updateBoard();

}


function updateBoard(){

document.querySelectorAll(".space")
.forEach(x=>x.classList.remove("player"));


document.getElementById(
"space"+position
).classList.add("player");

}



function chooseCharacter(name){

character=name;

document.getElementById("player").innerHTML=
"You are playing as: "+name;

document.getElementById("character").style.display="none";

}



function rollDice(){

let roll=Math.floor(Math.random()*6)+1;

position+=roll;


if(position>=spaces.length){

position=spaces.length-1;

}


updateBoard();


document.getElementById("status").innerHTML=
"You rolled "+roll+
" and moved to "+spaces[position];


drawEvent();

}



function drawEvent(){


let random=Math.floor(Math.random()*3);


let text="";


if(random==0){

text=
"🔎 Evidence Found:<br>"+
evidence[
Math.floor(Math.random()*evidence.length)
];

clues++;

}


else if(random==1){

text=
"⚖️ Decision:<br>"+
decisions[
Math.floor(Math.random()*decisions.length)
];

}


else{

text=
"⚠️ Consequence:<br>"+
consequences[
Math.floor(Math.random()*consequences.length)
];

clues=Math.max(0,clues-1);

}



document.getElementById("event").innerHTML=
"<div class='card'>"+text+"</div>";



document.getElementById("clues").innerHTML=
clues+" / 5 clues";



checkWin();

}



function checkWin(){


if(position==10 && clues>=5){

document.getElementById("event").innerHTML=
`
<div class="card">

<h2>🏆 YOU WIN!</h2>

You uncovered the truth:
<br><br>

Claudius murdered King Hamlet using poison
to steal the throne.

You saved Denmark from the tragedy.

</div>
`;

}

}



createBoard();


</script>


</body>
</html>
